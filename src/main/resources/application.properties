# Database and migrations (PROGETTO.md App. B.1)
quarkus.datasource.db-kind=postgresql
quarkus.hibernate-orm.multitenant=DISCRIMINATOR
quarkus.hibernate-orm.schema-management.strategy=none
# In tests Hibernate compares every entity with the schema Flyway built: an entity
# that drifts from its migration fails the build instead of failing in production.
%test.quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.flyway.migrate-at-start=true
# Tests add a shop table of their own (probe_item) to prove tenant isolation.
%test.quarkus.flyway.locations=db/migration,db/test-migration
# Quarkus defaults this to false: one stray clean-at-start=true, or a clean() call,
# would drop every table in production. Nothing in this project ever needs clean.
quarkus.flyway.clean-disabled=true

# Behind Caddy (PROGETTO.md App. B.1, ADR-0004). X-Forwarded-For/-Proto are
# honored only when the connection comes from the proxy network: the client IP
# and "https" for redirects. Everyone else's forwarded headers are ignored.
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-x-forwarded=true
quarkus.http.proxy.trusted-proxies=172.16.0.0/12
# Off on purpose, unlike App. B.1: Caddy already passes the original Host, and
# the shop is chosen from the Host alone. With this on, anything on the proxy
# network could pick the shop with X-Forwarded-Host (TrustedProxyTest fails if
# this is turned on; ProxyHeadersTest covers clients outside the proxy network).
quarkus.http.proxy.enable-forwarded-host=false

# Dev Services: pin the same major version used in production (PROGETTO.md §4.2)
quarkus.datasource.devservices.image-name=postgres:17

# Application: recognizes the platform's own domain vs. a shop's domain (§5.2).
# No prod default: the real domain is still an open question (§17.3), and a
# silent "localhost" fallback would quietly 404 the landing page, admin area and
# webhooks. PlatformConfig (@ConfigMapping) is validated at startup: without
# PLATFORM_BASE_DOMAIN the app does not start (PlatformConfigTest). The value
# must be normalized (PlatformDomain checks it at startup too).
app.platform.base-domain=${PLATFORM_BASE_DOMAIN}
%dev.app.platform.base-domain=localhost
%test.app.platform.base-domain=localhost
# Redirects between a shop's hosts keep the local port only in dev and test; in
# production the browser talks to Caddy on the default port.
%dev.app.platform.redirect-port=${quarkus.http.port:8080}
%test.app.platform.redirect-port=${quarkus.http.test-port:8081}

# Demo shop (docs/lab/giri/005-piano.md): invented data loaded at startup from
# demo/demo-shop.sql. Not a Flyway migration; off unless switched on here.
app.demo.seed=false
%dev.app.demo.seed=true
%prod.app.demo.seed=true

# Cart (giro 008): the technical "cart" cookie is Secure everywhere except dev and test,
# which run on plain http. The CSRF cookie too (the field value equals the cookie, no signing key).
app.cart.secure-cookie=true
%dev.app.cart.secure-cookie=false
%test.app.cart.secure-cookie=false
%prod.quarkus.rest-csrf.cookie-force-secure=true
